# Run docsign with its own PostgreSQL:
#   cp .env.example .env   # set ADMIN_PASSWORD and SESSION_SECRET
#   docker compose up -d
# Then open http://localhost:3000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: docsign
      POSTGRES_PASSWORD: docsign
      POSTGRES_DB: docsign
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docsign"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://docsign:docsign@db:5432/docsign
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
